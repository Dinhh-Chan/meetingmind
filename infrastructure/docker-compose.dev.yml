version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: meetingmind
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.11-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:RELEASE.2023-08-25T00-03-36Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"

  # Placeholder services (run from local code using compose overrides or separate docker-compose files)
  # api-gateway:
  #   build: ../api-gateway
  #   depends_on: [postgres, redis, rabbitmq]

  # core-service:
  #   build: ../core-service
  # ai-service:
  #   build: ../ai-service
  # bot-worker:
  #   build: ../bot-worker

volumes:
  postgres_data:
