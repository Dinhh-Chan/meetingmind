name: meetingmind

x-nest-environment: &nest-environment
  SERVER_ENV: development
  JWT_SECRET: meetingmind_jwt_secret
  JWT_EXP: 3600
  JWT_REFRESH_SECRET: meetingmind_refresh_secret
  JWT_REFRESH_EXP: 15552000
  SQL_TYPE: postgres
  SQL_HOST: postgres
  SQL_PORT: 5432
  SQL_DB: meetingmind
  # SQL_USER / SQL_PASSWORD / SQL_SCHEMA khai riêng cho từng service.
  # SQL_SYNCHRONIZE chỉ bật ở đúng một service mỗi schema, nếu không
  # nhiều tiến trình sẽ cùng ALTER TABLE lúc khởi động.
  SQL_SYNCHRONIZE: 0
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ""
  MICROSERVICE_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  MICROSERVICE_TCP_HOST: 0.0.0.0
  MICROSERVICE_TCP_HOST_CORE: core-service
  MICROSERVICE_TCP_PORT_CORE: 3002
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: 0
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_REGION: ap-southeast-1
  MINIO_BUCKET: meetingmind
  MINIO_MULTIPART_PART_SIZE: 16777216
  # Host trình duyệt gọi được; URL ký gắn với host nên phải khác host nội bộ.
  MINIO_PUBLIC_ENDPOINT: localhost
  MINIO_PUBLIC_PORT: 9000
  MINIO_PUBLIC_USE_SSL: 0
  ONE_SIGNAL_APP_ID: ""
  ONE_SIGNAL_API_KEY: ""
  SSO_JWKS_URI: ""
  SERVER_GW_API_KEY: local-dev-gateway-key

x-nest-common: &nest-common
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: meetingmind
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Chỉ chạy khi volume rỗng. Tạo extension vector, 3 schema, 3 role.
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d meetingmind"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.11-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api-gateway:
    restart: unless-stopped
    # Không dùng *nest-common: gateway dùng chung schema `core` nhưng
    # SQL_SYNCHRONIZE=0, nên phải đợi core-service tạo bảng xong mới khởi động.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      core-service:
        condition: service_healthy
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    environment:
      <<: *nest-environment
      SERVER_ADDRESS: http://localhost:3000
      SERVER_PORT: 3000
      SERVER_MASTER: 1
      MICROSERVICE_GRPC_PORT: 3001
      MICROSERVICE_TCP_PORT: 3002
      SERVER_GW_ADDRESS: http://api-gateway:3000
      SQL_USER: mm_core
      SQL_PASSWORD: mm_core_pass
      SQL_SCHEMA: core
      # core-service là chủ schema `core` nên chỉ nó được sinh bảng
    ports:
      - "3000:3000"

  core-service:
    <<: *nest-common
    build:
      context: ./core-service
      dockerfile: Dockerfile
    environment:
      <<: *nest-environment
      SERVER_ADDRESS: http://localhost:3010
      SERVER_PORT: 3010
      SERVER_MASTER: 0
      MICROSERVICE_GRPC_PORT: 3011
      MICROSERVICE_TCP_PORT: 3002
      SERVER_GW_ADDRESS: http://api-gateway:3000
      SQL_USER: mm_core
      SQL_PASSWORD: mm_core_pass
      SQL_SCHEMA: core
      SQL_SYNCHRONIZE: 1
      # Hỏi đáp tri thức: Core lọc quyền rồi gọi route /internal của ai-service.
      # AI_INTERNAL_TOKEN đặt ở file .env cạnh file này (đã gitignore), phải
      # trùng giá trị ai-service dùng; Core không bao giờ ghi nó ra log.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      # Đăng nhập Google: OAuth Client ID loại Web, trống thì ẩn nút Google.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Mời thành viên qua email: tài khoản Gmail + App Password, đặt trong .env.
      GMAIL_SMTP: ${GMAIL_SMTP:-}
      PASS_WORD_SMTP: ${PASS_WORD_SMTP:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-1}
      # Địa chỉ giao diện người nhận mở được, dùng trong link mời.
      APP_URL: ${APP_URL:-http://localhost:3001}
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3010/app/timestamp || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  integration-service:
    <<: *nest-common
    build:
      context: ./integration-service
      dockerfile: Dockerfile
    environment:
      <<: *nest-environment
      SERVER_ADDRESS: http://localhost:3020
      SERVER_PORT: 3020
      SERVER_MASTER: 0
      MICROSERVICE_GRPC_PORT: 3021
      MICROSERVICE_TCP_PORT: 3022
      SERVER_GW_ADDRESS: http://api-gateway:3000
      SQL_USER: mm_integration
      SQL_PASSWORD: mm_integration_pass
      SQL_SCHEMA: integration
      SQL_SYNCHRONIZE: 1
      # MICROSERVICE_RABBITMQ_URL lấy từ *nest-environment như core-service.
      # Đồng bộ công việc đã duyệt ra Trello/Telegram. Giá trị đặt ở file .env
      # cạnh file này (đã gitignore). Thiếu key/token thì nhà cung cấp đó bị
      # bỏ qua (skipped), không lỗi.
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      # Có TRELLO_LIST_ID thì dùng thẳng; không thì tìm/tạo list
      # TRELLO_LIST_NAME (mặc định "Việc từ cuộc họp") trên TRELLO_BOARD_ID.
      TRELLO_LIST_ID: ${TRELLO_LIST_ID:-}
      TRELLO_BOARD_ID: ${TRELLO_BOARD_ID:-}
      TRELLO_LIST_NAME: ${TRELLO_LIST_NAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Bỏ trống thì tự dò chat gần nhất đã nhắn cho bot (getUpdates).
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "3020:3020"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/app/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROJECT_NAME: MeetingMind AI Service
      DEBUG: "true"
      SECRET_KEY: meetingmind_ai_secret
      POSTGRES_DB: meetingmind
      POSTGRES_USER: mm_ai
      POSTGRES_PASSWORD: mm_ai_pass
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_SCHEMA: ai
      BACKEND_CORS_ORIGINS: '["*"]'
      API_PREFIX: /api
      API_VERSIONS: v1,v2
      API_VERSION: v2
      KEYCLOAK_VERIFY: "false"
      # Hỏi đáp tri thức cuộc họp (RAG), xem app/worker/knowledge_qa.py. Core
      # gọi /internal/knowledge/* kèm header X-Internal-Token; đặt token ở .env:
      #   AI_INTERNAL_TOKEN=<chuỗi ngẫu nhiên dài>
      # Để trống thì hai API này trả 503.
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-https://token-api.fpt.ai/v1}
      AI_LLM_API_KEY: ${FPT_AI_API_KEY:-}
      # Phải trùng model ai-worker dùng khi lập chỉ mục (cùng không gian vector).
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-Vietnamese_Embedding}
      AI_RERANK_MODEL: ${AI_RERANK_MODEL:-bge-reranker-v2-m3}
      AI_QA_MODEL: ${AI_QA_MODEL:-GLM-5.2}
      AI_QA_FALLBACK_MODEL: ${AI_QA_FALLBACK_MODEL:-DeepSeek-V4.1-Flash}
    ports:
      - "8000:8000"

  ai-worker:
    # Cùng image với ai-service, khác lệnh chạy: đây là tiến trình nhận việc
    # từ RabbitMQ, không phục vụ HTTP.
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.worker.main"]
    volumes:
      - whisper-models:/root/.cache/huggingface
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      # Lập chỉ mục hỏi đáp ghi vào ai.document_chunks.
      postgres:
        condition: service_healthy
    environment:
      MICROSERVICE_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: 0
      # Phiên âm thật bằng faster-whisper; đổi AI_STT=stub để chạy nhanh khi
      # không cần nội dung thật. Lần đầu tự tải model (small ~480 MB) về volume
      # whisper-models. Model lớn hơn (medium, large-v3) nghe tiếng Việt tốt hơn
      # nhưng chậm hơn nhiều trên CPU.
      AI_STT: ${AI_STT:-whisper}
      AI_WHISPER_MODEL: ${AI_WHISPER_MODEL:-small}
      AI_WHISPER_DEVICE: ${AI_WHISPER_DEVICE:-cpu}
      AI_WHISPER_COMPUTE_TYPE: ${AI_WHISPER_COMPUTE_TYPE:-int8}
      # Phân tích biên bản bằng LLM của FPT AI Factory (API kiểu OpenAI). Key
      # đặt ở file .env cạnh file này (đã gitignore), docker compose tự đọc:
      #   FPT_AI_API_KEY=sk-...
      # Thiếu key thì worker tự lùi về stub. Lý do chọn model: llm_analyzer.py.
      AI_LLM: ${AI_LLM:-fpt}
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-https://token-api.fpt.ai/v1}
      AI_LLM_API_KEY: ${FPT_AI_API_KEY:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-DeepSeek-V4.1-Flash}
      AI_LLM_FALLBACK_MODEL: ${AI_LLM_FALLBACK_MODEL:-GLM-5.2}
      # Nhúng vector khi lập chỉ mục hỏi đáp (knowledge.index.requested); dùng
      # chung key FPT ở trên. Phải trùng AI_EMBEDDING_MODEL của ai-service.
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-Vietnamese_Embedding}
      # Số trang PDF scan tối đa được OCR mỗi tài liệu (Tesseract trong
      # container, vài giây/trang); trang vượt quá chỉ dùng lớp chữ sẵn có.
      AI_OCR_MAX_PAGES: ${AI_OCR_MAX_PAGES:-50}
      SECRET_KEY: meetingmind_ai_secret
      POSTGRES_DB: meetingmind
      POSTGRES_USER: mm_ai
      POSTGRES_PASSWORD: mm_ai_pass
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_SCHEMA: ai

  bot-worker:
    # Vào Google Meet bằng Chromium (Playwright) trên màn hình ảo, ghi âm
    # giọng những người khác rồi đẩy lên MinIO. Cần đăng nhập tài khoản Google
    # của bot một lần — xem bot-worker/README.md.
    build:
      context: ./bot-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    # Chromium cần /dev/shm lớn, mặc định 64 MB làm tab Meet sập.
    shm_size: "1gb"
    environment:
      MICROSERVICE_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: 0
      MINIO_BUCKET: meetingmind
      BOT_PROFILE_DIR: /profile
      BOT_NAME: MeetingMind Bot
      BOT_ADMISSION_TIMEOUT_S: 300
      BOT_ALONE_TIMEOUT_S: 60
      # Ảnh chụp từng bước trong container, lấy ra bằng docker cp khi cần dò lỗi.
      BOT_DEBUG_DIR: /tmp/mm-bot/debug
    volumes:
      - bot-profile:/profile

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3005:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  minio_data:
  grafana_data:
  # Model Whisper tải lần đầu; giữ lại khi dựng lại container ai-worker.
  whisper-models:
  # Hồ sơ Chromium đã đăng nhập tài khoản Google của bot (bot-worker/login.sh).
  bot-profile:
